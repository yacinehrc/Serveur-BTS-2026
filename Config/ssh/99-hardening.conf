# /etc/ssh/sshd_config.d/99-hardening.conf
# Durcissement du serveur OpenSSH

# Interdit la connexion directe du compte root (administration via sudo)
PermitRootLogin no

# Authentification par clé uniquement : mots de passe désactivés
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# Liste blanche des comptes autorisés à se connecter
AllowUsers user

# 3 tentatives par connexion, 30 secondes pour s'authentifier
MaxAuthTries 3
LoginGraceTime 30

# Fonction graphique inutile sur un serveur
X11Forwarding no

# Fermeture des sessions inactives (2 x 300 s)
ClientAliveInterval 300
ClientAliveCountMax 2
